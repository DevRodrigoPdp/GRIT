services:
  postgres-db:
    image: postgres:17-alpine
    container_name: grit-postgres-db
    environment:
      - POSTGRES_DB=grit_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
      # Inyección del script de inicialización
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped

  backend-app:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: grit-backend
      ports:
        - "9090:8080"
      environment:
        - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/grit_db
        - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
        - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
        - SPRING_JPA_HIBERNATE_DDL_AUTO=validate # Flyway gestionará la estructura
        - APPLICATION_SECURITY_JWT_SECRET_KEY="${JWT_SECRET_KEY}"
        - APPLICATION_SECURITY_JWT_PEPPER="${SECURITY_PEPPER_PROD}"
        - APPLICATION_SECURITY_JWT_EXPIRATION=900000
      depends_on:
        postgres-db:
          condition: service_healthy
      networks:
        - backend-network

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-app
    networks:
      - backend-network
    restart: unless-stopped
networks:
  backend-network:
    name: grit-postgres-net
    driver: bridge