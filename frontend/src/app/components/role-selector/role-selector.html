<section id="elegir-rol" class="h-screen flex flex-col overflow-hidden">

  <!-- Section header -->
  <div class="px-6 pt-6 pb-4 w-full flex-shrink-0">

    <div class="flex items-start justify-between gap-4 mb-3">
      <div>
        <div class="flex items-center gap-3 mb-3">
          <div class="w-5 h-px bg-[#2ED38D]"></div>
          <span class="text-xs font-bold tracking-[0.3em] uppercase text-[#2ED38D]">PASO 01 / IDENTIFICACIÓN</span>
        </div>
        <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter text-black leading-[0.9]">
          ¿QUIÉN ERES?
        </h2>
      </div>

      <!-- Back button -->
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 text-xs font-bold tracking-[0.2em] uppercase text-gray-400 hover:text-black transition-colors duration-200 no-underline flex-shrink-0 group"
      >
        <svg class="w-3.5 h-3.5 transition-transform duration-200 group-hover:-translate-x-1" viewBox="0 0 16 16" fill="none">
          <path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
        VOLVER
      </a>
    </div>

  </div>

  <!-- Cards -->
  <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 border-t border-[#E5E7EB] overflow-hidden">

    <!-- ATLETA -->
    <button
      class="group relative flex flex-col justify-between p-8 text-left border-b sm:border-b-0 sm:border-r border-[#E5E7EB] transition-colors duration-300 cursor-pointer overflow-hidden"
      [class.bg-black]="selectedRole() === 'atleta'"
      [class.bg-white]="selectedRole() !== 'atleta'"
      (click)="select('atleta')"
      (mouseenter)="hoveredRole.set('atleta')"
      (mouseleave)="hoveredRole.set(null)"
    >
      <span
        class="absolute top-4 right-6 text-[6rem] font-extrabold leading-none select-none pointer-events-none transition-colors duration-300"
        [class.text-white]="selectedRole() === 'atleta'"
        [class.text-[#F3F4F6]]="selectedRole() !== 'atleta'"
        [class.opacity-10]="selectedRole() === 'atleta'"
      >01</span>

      <div class="relative z-10">
        <div
          class="w-9 h-9 border flex items-center justify-center mb-4 transition-colors duration-300"
          [class.border-[#2ED38D]]="selectedRole() === 'atleta' || hoveredRole() === 'atleta'"
          [class.border-[#E5E7EB]]="selectedRole() !== 'atleta' && hoveredRole() !== 'atleta'"
        >
          <svg class="w-4 h-4 transition-colors duration-300"
            [class.text-[#2ED38D]]="selectedRole() === 'atleta' || hoveredRole() === 'atleta'"
            [class.text-black]="selectedRole() !== 'atleta' && hoveredRole() !== 'atleta'"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="5" r="2"/>
            <path d="M12 7v6M9 10l-3 4h12l-3-4M9 20l1-4h4l1 4" stroke-linecap="square"/>
          </svg>
        </div>

        <div
          class="text-[10px] font-bold tracking-[0.3em] uppercase mb-2 transition-colors duration-300"
          [class.text-[#2ED38D]]="selectedRole() === 'atleta'"
          [class.text-gray-400]="selectedRole() !== 'atleta'"
        >ROL / 01</div>

        <h3
          class="text-3xl md:text-4xl font-black uppercase tracking-tighter leading-[0.9] mb-3 transition-colors duration-300"
          [class.text-white]="selectedRole() === 'atleta'"
          [class.text-black]="selectedRole() !== 'atleta'"
        >ATLETA</h3>

        <p
          class="text-xs font-light leading-relaxed max-w-xs transition-colors duration-300"
          [class.text-gray-400]="selectedRole() === 'atleta'"
          [class.text-gray-500]="selectedRole() !== 'atleta'"
        >
          Dashboard personal, métricas biométricas y planes nutricionales adaptados a tus objetivos.
        </p>
      </div>

      <div
        class="relative z-10 flex items-center gap-2 text-xs font-bold tracking-[0.2em] uppercase mt-6 transition-colors duration-300"
        [class.text-[#2ED38D]]="selectedRole() === 'atleta' || hoveredRole() === 'atleta'"
        [class.text-gray-300]="selectedRole() !== 'atleta' && hoveredRole() !== 'atleta'"
      >
        <span>{{ selectedRole() === 'atleta' ? 'SELECCIONADO' : 'SELECCIONAR' }}</span>
        <svg class="w-3 h-3 transition-transform duration-200"
          [class.translate-x-1]="hoveredRole() === 'atleta' || selectedRole() === 'atleta'"
          viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </div>
    </button>

    <!-- ENTRENADOR -->
    <button
      class="group relative flex flex-col justify-between p-8 text-left transition-colors duration-300 cursor-pointer overflow-hidden"
      [class.bg-black]="selectedRole() === 'entrenador'"
      [class.bg-white]="selectedRole() !== 'entrenador'"
      (click)="select('entrenador')"
      (mouseenter)="hoveredRole.set('entrenador')"
      (mouseleave)="hoveredRole.set(null)"
    >
      <span
        class="absolute top-4 right-6 text-[6rem] font-extrabold leading-none select-none pointer-events-none transition-colors duration-300"
        [class.text-white]="selectedRole() === 'entrenador'"
        [class.text-[#F3F4F6]]="selectedRole() !== 'entrenador'"
        [class.opacity-10]="selectedRole() === 'entrenador'"
      >02</span>

      <div class="relative z-10">
        <div
          class="w-9 h-9 border flex items-center justify-center mb-4 transition-colors duration-300"
          [class.border-[#2ED38D]]="selectedRole() === 'entrenador' || hoveredRole() === 'entrenador'"
          [class.border-[#E5E7EB]]="selectedRole() !== 'entrenador' && hoveredRole() !== 'entrenador'"
        >
          <svg class="w-4 h-4 transition-colors duration-300"
            [class.text-[#2ED38D]]="selectedRole() === 'entrenador' || hoveredRole() === 'entrenador'"
            [class.text-black]="selectedRole() !== 'entrenador' && hoveredRole() !== 'entrenador'"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="7" height="7" stroke-linecap="square"/>
            <rect x="14" y="3" width="7" height="7" stroke-linecap="square"/>
            <rect x="3" y="14" width="7" height="7" stroke-linecap="square"/>
            <path d="M14 17.5h7M17.5 14v7" stroke-linecap="square"/>
          </svg>
        </div>

        <div
          class="text-[10px] font-bold tracking-[0.3em] uppercase mb-2 transition-colors duration-300"
          [class.text-[#2ED38D]]="selectedRole() === 'entrenador'"
          [class.text-gray-400]="selectedRole() !== 'entrenador'"
        >ROL / 02</div>

        <h3
          class="text-3xl md:text-4xl font-black uppercase tracking-tighter leading-[0.9] mb-3 transition-colors duration-300"
          [class.text-white]="selectedRole() === 'entrenador'"
          [class.text-black]="selectedRole() !== 'entrenador'"
        >ENTRENADOR</h3>

        <p
          class="text-xs font-light leading-relaxed max-w-xs transition-colors duration-300"
          [class.text-gray-400]="selectedRole() === 'entrenador'"
          [class.text-gray-500]="selectedRole() !== 'entrenador'"
        >
          Gestiona múltiples atletas, diseña programas y monitoriza el progreso desde un panel centralizado.
        </p>
      </div>

      <div
        class="relative z-10 flex items-center gap-2 text-xs font-bold tracking-[0.2em] uppercase mt-6 transition-colors duration-300"
        [class.text-[#2ED38D]]="selectedRole() === 'entrenador' || hoveredRole() === 'entrenador'"
        [class.text-gray-300]="selectedRole() !== 'entrenador' && hoveredRole() !== 'entrenador'"
      >
        <span>{{ selectedRole() === 'entrenador' ? 'SELECCIONADO' : 'SELECCIONAR' }}</span>
        <svg class="w-3 h-3 transition-transform duration-200"
          [class.translate-x-1]="hoveredRole() === 'entrenador' || selectedRole() === 'entrenador'"
          viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </div>
    </button>

  </div>

  <!-- Confirm bar — dentro del flex, siempre visible -->
  @if (selectedRole()) {
    <div class="border-t border-[#E5E7EB] bg-white px-6 md:px-12 py-3 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-1.5 h-1.5 rounded-full bg-[#2ED38D] animate-pulse"></div>
        <span class="text-xs font-bold tracking-[0.2em] uppercase text-black">
          PERFIL: <span class="text-[#2ED38D]">{{ selectedRole()!.toUpperCase() }}</span>
        </span>
      </div>
      <button
        type="button"
        (click)="continuar()"
        class="inline-flex items-center gap-3 bg-black text-white px-8 py-3 text-xs font-bold uppercase tracking-widest hover:bg-[#2ED38D] hover:text-black transition-all duration-300 cursor-pointer"
      >
        CONTINUAR
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </button>
    </div>
  }

</section>
