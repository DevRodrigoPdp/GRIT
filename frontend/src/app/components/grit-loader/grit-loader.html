<div class="loader-wrap fixed inset-0 bg-white z-50 flex flex-col items-center justify-center gap-6">

  <svg
    viewBox="0 0 320 100"
    width="260"
    fill="none"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-label="GRIT"
  >
    <!-- ── G ── -->
    <!-- top bar -->
    <line class="seg g-top"   x1="15" y1="18" x2="68" y2="18"/>
    <!-- left vertical -->
    <line class="seg g-left"  x1="15" y1="18" x2="15" y2="82"/>
    <!-- bottom bar -->
    <line class="seg g-bot"   x1="15" y1="82" x2="68" y2="82"/>
    <!-- right lower vertical -->
    <line class="seg g-right" x1="68" y1="50" x2="68" y2="82"/>
    <!-- middle bar (accent) -->
    <line class="seg g-mid"   x1="42" y1="50" x2="68" y2="50"/>

    <!-- ── R ── -->
    <!-- left vertical -->
    <line class="seg r-left"  x1="88" y1="18" x2="88"  y2="82"/>
    <!-- top bar -->
    <line class="seg r-top"   x1="88" y1="18" x2="132" y2="18"/>
    <!-- right top vertical (bump) -->
    <line class="seg r-rtop"  x1="132" y1="18" x2="132" y2="50"/>
    <!-- mid bar (accent) -->
    <line class="seg r-mid"   x1="88"  y1="50" x2="132" y2="50"/>
    <!-- diagonal leg -->
    <line class="seg r-leg"   x1="110" y1="50" x2="148" y2="82"/>

    <!-- ── I ── -->
    <!-- vertical -->
    <line class="seg i-vert"  x1="184" y1="18" x2="184" y2="82"/>
    <!-- top cap (accent) -->
    <line class="seg i-top"   x1="164" y1="18" x2="204" y2="18"/>
    <!-- bottom cap (accent) -->
    <line class="seg i-bot"   x1="164" y1="82" x2="204" y2="82"/>

    <!-- ── T ── -->
    <!-- top bar -->
    <line class="seg t-top"   x1="224" y1="18" x2="304" y2="18"/>
    <!-- vertical -->
    <line class="seg t-vert"  x1="264" y1="18" x2="264" y2="82"/>
  </svg>

  <span class="text-[10px] font-bold tracking-[0.4em] uppercase text-gray-300">
    CARGANDO PERFIL
  </span>

</div>
