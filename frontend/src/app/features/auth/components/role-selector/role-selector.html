<section class="h-screen flex flex-col overflow-hidden">

  <!-- Top bar -->
  <div class="border-b border-[#E5E7EB] px-6 md:px-12 h-14 flex items-center justify-between flex-shrink-0 bg-white z-10">
    <div class="flex items-center gap-6">
      <span class="font-black tracking-tighter text-lg text-black uppercase select-none">GRIT</span>
      <div class="hidden sm:flex items-center gap-3">
        <div class="w-5 h-px bg-[#2ED38D]"></div>
        <span class="text-xs font-bold tracking-[0.3em] uppercase text-[#2ED38D]">PASO 01 / IDENTIFICACIÓN</span>
      </div>
    </div>
    <a
      routerLink="/"
      class="inline-flex items-center gap-2 text-xs font-bold tracking-[0.2em] uppercase text-gray-400 hover:text-black transition-colors duration-200 no-underline flex-shrink-0 group"
    >
      <svg class="w-3.5 h-3.5 transition-transform duration-200 group-hover:-translate-x-1" viewBox="0 0 16 16" fill="none">
        <path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
      </svg>
      VOLVER
    </a>
  </div>

  <!-- Cards -->
  <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 overflow-hidden">

    <!-- ATLETA -->
    <button
      class="group relative flex flex-col justify-between p-8 sm:p-12 text-left border-b sm:border-b-0 sm:border-r border-white/10 transition-all duration-500 cursor-pointer overflow-hidden"
      (click)="select('atleta')"
      (mouseenter)="hoveredRole.set('atleta')"
      (mouseleave)="hoveredRole.set(null)"
    >
      <!-- Fondo -->
      <div
        class="absolute inset-0 bg-cover bg-center"
        style="background-color: #0a0a0a; background-image: url('/images/ejercicio/victor-freitas-WvDYdXDzkhs-unsplash.webp'); background-size: cover; background-position: center;"
      ></div>
      <div
        class="absolute inset-0 transition-all duration-500"
        [class]="selectedRole() === 'atleta' || hoveredRole() === 'atleta'
          ? 'bg-gradient-to-b from-black/60 via-black/50 to-black/70'
          : 'bg-gradient-to-b from-black/75 via-black/65 to-black/80'"
      ></div>

      <!-- Número decorativo -->
      <span class="absolute top-4 right-6 text-[6rem] font-extrabold leading-none select-none pointer-events-none text-white/10">01</span>

      <!-- Contenido -->
      <div class="relative z-10">
        <div
          class="w-9 h-9 border flex items-center justify-center mb-6 transition-colors duration-300"
          [class.border-[#2ED38D]]="selectedRole() === 'atleta' || hoveredRole() === 'atleta'"
          [class.border-white/30]="selectedRole() !== 'atleta' && hoveredRole() !== 'atleta'"
        >
          <svg
            class="w-4 h-4 transition-colors duration-300"
            [class.text-[#2ED38D]]="selectedRole() === 'atleta' || hoveredRole() === 'atleta'"
            [class.text-white]="selectedRole() !== 'atleta' && hoveredRole() !== 'atleta'"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          >
            <circle cx="12" cy="5" r="2"/>
            <path d="M12 7v6M9 10l-3 4h12l-3-4M9 20l1-4h4l1 4" stroke-linecap="square"/>
          </svg>
        </div>

        <div
          class="text-[10px] font-bold tracking-[0.3em] uppercase mb-2 transition-colors duration-300"
          [class.text-[#2ED38D]]="selectedRole() === 'atleta'"
          [class.text-white/50]="selectedRole() !== 'atleta'"
        >ROL / 01</div>

        <h3 class="text-4xl md:text-5xl font-black uppercase tracking-tighter leading-[0.9] mb-4 text-white">ATLETA</h3>

        <p class="text-sm font-light leading-relaxed max-w-xs text-gray-300">
          Dashboard personal, métricas biométricas y planes nutricionales adaptados a tus objetivos.
        </p>
      </div>

      <div
        class="relative z-10 flex items-center gap-2 text-xs font-bold tracking-[0.2em] uppercase mt-6 transition-colors duration-300"
        [class.text-[#2ED38D]]="selectedRole() === 'atleta' || hoveredRole() === 'atleta'"
        [class.text-white/40]="selectedRole() !== 'atleta' && hoveredRole() !== 'atleta'"
      >
        <span>{{ selectedRole() === 'atleta' ? 'SELECCIONADO' : 'SELECCIONAR' }}</span>
        <svg
          class="w-3 h-3 transition-transform duration-200"
          [class.translate-x-1]="hoveredRole() === 'atleta' || selectedRole() === 'atleta'"
          viewBox="0 0 16 16" fill="none"
        >
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </div>
    </button>

    <!-- ENTRENADOR -->
    <button
      class="group relative flex flex-col justify-between p-8 sm:p-12 text-left transition-all duration-500 cursor-pointer overflow-hidden"
      (click)="select('entrenador')"
      (mouseenter)="hoveredRole.set('entrenador')"
      (mouseleave)="hoveredRole.set(null)"
    >
      <!-- Fondo split -->
      <div
        class="absolute inset-y-0 left-0 w-1/2 bg-cover bg-center"
        style="background-color: #0a0a0a; background-image: url('/images/nutricion/anna-pelzer-IGfIGP5ONV0-unsplash.webp')"
      ></div>
      <div
        class="absolute inset-y-0 right-0 w-1/2 bg-cover bg-center"
        style="background-color: #0a0a0a; background-image: url('/images/ejercicio/sven-mieke-optBC2FxCfc-unsplash.webp')"
      ></div>
      <div class="absolute inset-y-0 left-1/2 w-px bg-white/20 z-[1]"></div>
      <div
        class="absolute inset-0 transition-all duration-500"
        [class]="selectedRole() === 'entrenador' || hoveredRole() === 'entrenador'
          ? 'bg-gradient-to-b from-black/60 via-black/50 to-black/70'
          : 'bg-gradient-to-b from-black/75 via-black/65 to-black/80'"
      ></div>

      <!-- Número decorativo -->
      <span class="absolute top-4 right-6 text-[6rem] font-extrabold leading-none select-none pointer-events-none text-white/10">02</span>

      <!-- Contenido -->
      <div class="relative z-10">
        <div
          class="w-9 h-9 border flex items-center justify-center mb-6 transition-colors duration-300"
          [class.border-[#2ED38D]]="selectedRole() === 'entrenador' || hoveredRole() === 'entrenador'"
          [class.border-white/30]="selectedRole() !== 'entrenador' && hoveredRole() !== 'entrenador'"
        >
          <svg
            class="w-4 h-4 transition-colors duration-300"
            [class.text-[#2ED38D]]="selectedRole() === 'entrenador' || hoveredRole() === 'entrenador'"
            [class.text-white]="selectedRole() !== 'entrenador' && hoveredRole() !== 'entrenador'"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          >
            <rect x="3" y="3" width="7" height="7" stroke-linecap="square"/>
            <rect x="14" y="3" width="7" height="7" stroke-linecap="square"/>
            <rect x="3" y="14" width="7" height="7" stroke-linecap="square"/>
            <path d="M14 17.5h7M17.5 14v7" stroke-linecap="square"/>
          </svg>
        </div>

        <div
          class="text-[10px] font-bold tracking-[0.3em] uppercase mb-2 transition-colors duration-300"
          [class.text-[#2ED38D]]="selectedRole() === 'entrenador'"
          [class.text-white/50]="selectedRole() !== 'entrenador'"
        >ROL / 02</div>

        <h3 class="text-4xl md:text-5xl font-black uppercase tracking-tighter leading-[0.9] mb-4 text-white">ENTRENADOR<br><span class="text-[#2ED38D]">/ NUTRICIONISTA</span></h3>

        <p class="text-sm font-light leading-relaxed max-w-xs text-gray-300">
          Gestiona múltiples atletas, diseña programas y monitoriza el progreso desde un panel centralizado.
        </p>
      </div>

      <div
        class="relative z-10 flex items-center gap-2 text-xs font-bold tracking-[0.2em] uppercase mt-6 transition-colors duration-300"
        [class.text-[#2ED38D]]="selectedRole() === 'entrenador' || hoveredRole() === 'entrenador'"
        [class.text-white/40]="selectedRole() !== 'entrenador' && hoveredRole() !== 'entrenador'"
      >
        <span>{{ selectedRole() === 'entrenador' ? 'SELECCIONADO' : 'SELECCIONAR' }}</span>
        <svg
          class="w-3 h-3 transition-transform duration-200"
          [class.translate-x-1]="hoveredRole() === 'entrenador' || selectedRole() === 'entrenador'"
          viewBox="0 0 16 16" fill="none"
        >
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </div>
    </button>

  </div>

  <!-- Confirm bar -->
  @if (selectedRole()) {
    <div @slideUp class="border-t border-[#E5E7EB] bg-white px-6 md:px-12 py-3 flex items-center justify-between flex-shrink-0 z-10">
      <div class="flex items-center gap-3">
        <div class="w-1.5 h-1.5 rounded-full bg-[#2ED38D] animate-pulse"></div>
        <span class="text-xs font-bold tracking-[0.2em] uppercase text-black">
          PERFIL: <span class="text-[#2ED38D]">{{ selectedRole()!.toUpperCase() }}</span>
        </span>
      </div>
      <button
        type="button"
        (click)="continuar()"
        class="inline-flex items-center gap-3 bg-black text-white px-8 py-3 text-xs font-bold uppercase tracking-widest hover:bg-[#2ED38D] hover:text-black transition-all duration-300 cursor-pointer"
      >
        CONTINUAR
        <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </button>
    </div>
  }

</section>
