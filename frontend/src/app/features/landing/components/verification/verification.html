<section id="como-funciona" class="border-b border-[#E5E7EB]">
  <div class="max-w-7xl mx-auto px-6">

    <!-- Section Header -->
    <div class="py-16 border-b border-[#E5E7EB] flex flex-col md:flex-row md:items-end md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-3 mb-4">
          <div class="w-5 h-px bg-[#2ED38D]"></div>
          <span class="text-xs font-bold tracking-[0.3em] uppercase text-[#2ED38D]">CÓMO FUNCIONA</span>
        </div>
        <h2 class="text-5xl md:text-6xl font-black uppercase tracking-tighter text-black leading-[0.9]">
          SIMPLE.<br>
          VERIFICADO.<br>
          EFECTIVO.
        </h2>
      </div>
      <div class="max-w-xs">
        <p class="text-sm font-light leading-relaxed text-gray-500">
          Tres pasos para conectar a los mejores entrenadores certificados con atletas que quieren ir en serio.
        </p>
      </div>
    </div>

    <!-- Grid Items -->
    <div class="grid grid-cols-1 md:grid-cols-3 border-b border-[#E5E7EB]">
      @for (item of items(); track item.number) {
        <div
          class="p-12 flex flex-col"
          [class.border-r]="!item.isLast"
          [class.border-[#E5E7EB]]="!item.isLast"
          [class.border-b]="!item.isLast"
          [class.md:border-b-0]="true"
        >
          <!-- Big Number -->
          <span class="text-8xl font-extrabold text-[#F3F4F6] leading-none mb-6 select-none">
            {{ item.number }}
          </span>

          <!-- Accent Line -->
          <div class="w-8 h-0.5 bg-[#2ED38D] mb-6"></div>

          <!-- Title -->
          <h3 class="text-sm font-black uppercase tracking-[0.15em] text-black mb-4 leading-tight">
            {{ item.title }}
          </h3>

          <!-- Description -->
          <p class="text-sm font-light leading-relaxed text-gray-500 flex-1">
            {{ item.description }}
          </p>
        </div>
      }
    </div>

  </div>
</section>
