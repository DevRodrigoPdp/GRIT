<div class="min-h-screen bg-white flex flex-col">

  <!-- Top bar -->
  <header class="border-b border-[#E5E7EB] px-6 md:px-12 h-14 flex items-center justify-between flex-shrink-0">
    <span class="font-black tracking-tighter text-lg text-black uppercase select-none">GRIT</span>
    <div class="flex items-center gap-6">
      <span class="text-xs font-bold tracking-[0.2em] uppercase text-[#2ED38D]">● VERIFICADO</span>
      <button
        (click)="auth.logout()"
        class="text-xs font-bold tracking-[0.2em] uppercase text-gray-400 hover:text-black transition-colors duration-200"
      >
        CERRAR SESIÓN
      </button>
    </div>
  </header>

  <!-- Contenido placeholder -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-5 h-px bg-[#2ED38D]"></div>
      <span class="text-xs font-bold tracking-[0.3em] uppercase text-[#2ED38D]">DASHBOARD / ENTRENADOR</span>
      <div class="w-5 h-px bg-[#2ED38D]"></div>
    </div>
    <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter text-black leading-[0.9] mb-6">
      TU PANEL<br>PROFESIONAL
    </h1>
    <p class="text-sm font-light text-gray-400 max-w-md mb-12">
      Dashboard en construcción. Aquí gestionarás tus atletas, planes de entrenamiento, análisis biométrico y documentación.
    </p>
    <div class="border border-[#E5E7EB] px-8 py-4 text-xs font-bold tracking-[0.3em] uppercase text-gray-300">
      PRÓXIMAMENTE
    </div>
  </main>

</div>
