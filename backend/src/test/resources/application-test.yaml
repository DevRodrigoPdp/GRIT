spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        query:
          sqm:
            mutation_strategy: org.hibernate.query.sqm.mutation.internal.idtable.LocalTemporaryTableMutationStrategy
application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    pepper: ${SECURITY_PEPPER_PROD:pepper_dev_local_secret_2026}
    jwt:
      # Clave de desarrollo (puede ser conocida por el equipo)
      secret-key: ${JWT_SECRET_KEY:clave_de_desarrollo_muy_larga_y_segura_1234567890}
    cookie:
      secure: false
  storage:
    # Configuración personalizada para nuestro Service
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket-name: grit-certificaciones-entrenadores
  seed:
    admin-email: "admin@test.com"
    coach-email: "coach@test.com"
    atleta-email: "atleta@test.com"

management:
  endpoint:
    health:
      show-details: always