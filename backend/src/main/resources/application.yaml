spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: grit-backend
  jpa:
    open-in-view: false # Buena práctica: evitar consultas extra en la vista
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB          # Límite por archivo
      max-request-size: 15MB       # Límite total de la petición (archivo + otros campos)
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: always # Útil para que el frontend sepa qué falló

application:
  security:
    jwt:
      expiration: 900000
      refresh-token:
        expiration: 604800000

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health, info, metrics # Métricas básicas para todos
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

