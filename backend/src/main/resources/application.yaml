spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: grit-backend
  jpa:
    open-in-view: false # Buena práctica: evitar consultas extra en la vista
    properties:
      hibernate:
        # Habilita estadísticas para que Micrometer pueda medir tiempos de DB
        generate_statistics: true
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB  # Permitimos margen para varios archivos y el resto del JSON
      file-size-threshold: 2KB # Archivos mayores a esto se escriben temporalmente en disco para no saturar la RAM

server:
  port: ${PORT:8080}

application:
  security:
    jwt:
      expiration: 900000
      refresh-token:
        expiration: 604800000

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: [health, info, metrics, prometheus]
  metrics:
    tags:
      application: grit-backend
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true


