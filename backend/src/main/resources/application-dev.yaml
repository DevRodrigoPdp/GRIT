spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/grit_db}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:password_de_tu_env}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GritFit-HikariPool
      connection-timeout: 15000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 5
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate # Flyway manda, Hibernate solo valida que todo coincida
    show-sql: false
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    root: INFO
    grit.sistema.backend: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.SQL: DEBUG
    org.flywaydb.core.internal.database.base.Database: ERROR

application:
    security:
      pepper: ${SECURITY_PEPPER_PROD:pepper_dev_local_secret_2026}
      jwt:
        # Clave de desarrollo (puede ser conocida por el equipo)
        secret-key: ${JWT_SECRET_KEY:clave_de_desarrollo_muy_larga_y_segura_1234567890}