spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Flyway manda, Hibernate solo valida que todo coincida
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    com.sistema.gritfitprueba: DEBUG
    org.hibernate.SQL: DEBUG