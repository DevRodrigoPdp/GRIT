spring:
  datasource:
    # Añadimos el modo de compatibilidad con Postgres
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Desactivamos Flyway en tests para evitar el error de CREATE EXTENSION
  flyway:
    enabled: false

  jpa:
    hibernate:
      # Dejamos que Hibernate cree las tablas automáticamente basándose en tus clases @Entity
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# CONFIGURACIÓN DE SEGURIDAD PARA TESTS
application:
  security:
    pepper: "pepper_test_local_secret_2026"
    jwt:
      # Una clave de al menos 32 caracteres para que no de error de seguridad
      secret-key: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      expiration: 3600000 # 1 hora

management:
  endpoint:
    health:
      show-details: always