services:
  postgres-db:
    image: postgres:17-alpine
    container_name: grit-postgres-db
    environment:
      - POSTGRES_DB=grit_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
      # Inyección del script de inicialización
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: unless-stopped

  grit-minio:
    image: minio/minio
    container_name: grit-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./docker/minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend-network

  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grit-backend
    ports:
      - "9090:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/grit_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate # Flyway gestionará la estructura
      - APPLICATION_SECURITY_JWT_SECRET_KEY="${JWT_SECRET_KEY}"
      - APPLICATION_SECURITY_JWT_PEPPER="${SECURITY_PEPPER_PROD}"
      - APPLICATION_SECURITY_JWT_EXPIRATION=900000
      - APPLICATION_STORAGE_ENDPOINT=http://grit-minio:9000
      - APPLICATION_STORAGE_BUCKET_NAME=certificaciones-entrenadores
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED=true
      - MANAGEMENT_HEALTH_READINESSSTATE_ENABLED=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/management/health/liveness" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend-network

networks:
  backend-network:
    name: grit-postgres-net
    driver: bridge