services:
  postgres-db:
    image: postgres:17-alpine
    container_name: sistema-gestion-db
    environment:
      - POSTGRES_DB=sistema_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
      # Inyección del script de inicialización
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d sistema_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    restart: always

networks:
  backend-network:
    driver: bridge